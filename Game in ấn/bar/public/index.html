<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Print Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314171c'/%3E%3Crect x='10' y='22' width='44' height='20' rx='4' fill='%23e8661c'/%3E%3Crect x='18' y='10' width='28' height='12' rx='2' fill='%23e9e6df'/%3E%3Crect x='18' y='38' width='28' height='18' rx='2' fill='%23f3ecd9'/%3E%3Ccircle cx='32' cy='46' r='5' fill='%23ffc85a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="print.css">
</head>
<body class="studio">
<div id="app">
  <canvas id="scene"></canvas>
  <div id="hearts"></div>

  <header id="top">
    <div class="brand"><span class="logo">🖨️</span><div><b>LIVE PRINT STUDIO</b><small>Tặng quà · máy in in ảnh của bạn</small></div></div>
    <div class="pills">
      <span class="pill" id="online">0 người xem</span>
      <span class="pill" id="liveStatus">Chưa kết nối</span>
      <button class="pill btn" id="liveBtn" title="Mở màn hình LIVE 9:16 (cửa sổ riêng để TikTok LIVE Studio chụp)">📺 Mở màn 9:16</button>
      <button class="pill btn" id="musicBtn" title="Nhạc">🎵</button>
      <button class="pill btn" id="soundBtn" title="Âm thanh">🔈</button>
    </div>
  </header>

  <aside id="legend" class="panel"></aside>
  <aside id="now" class="panel" hidden></aside>
  <aside id="queue" class="panel" hidden></aside>
  <div id="banner" hidden></div>
  <ul id="feed"></ul>
  <div id="catalog" hidden></div>

  <div id="sim" hidden>
    <button id="simToggle" class="simToggle">🧪 Bảng thử</button>
    <div id="simBody" class="panel"></div>
  </div>
  <button id="musicHint" hidden>🎵 Bấm để bật nhạc và âm thanh máy in</button>
  <div id="loading">Đang dựng máy in và phòng trưng bày…</div>
  <div id="fairNote">Trò chơi giải trí · Quà tặng là tự nguyện, không đổi ra tiền hay phần thưởng · Bản in là hình ảnh trong game</div>
  <div id="offline" hidden>Mất kết nối server, đang thử lại…</div>
</div>
<script src="print.js"></script>
</body>
</html>
