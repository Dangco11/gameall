# Mẫu nginx cho hai tên miền con (đổi ten-mien.vn, xin chứng chỉ bằng certbot rồi bật listen 443 ssl)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80; server_name game.ten-mien.vn;
  client_max_body_size 2m;
  location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}
server {
  listen 80; server_name play.ten-mien.vn;
  location / { proxy_pass http://127.0.0.1:8081; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
               proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }
}
# Trang admin (cổng 9090) KHÔNG đưa ra mạng. Vào từ máy bạn qua đường hầm SSH:
#   ssh -L 9090:127.0.0.1:9090 user@may-chu   rồi mở http://localhost:9090
