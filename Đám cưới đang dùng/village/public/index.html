<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đám Cưới Làng Quê</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c8231d'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23ffd34d'%3E%E5%9B%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="wedding cuoi">
<div id="app">
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <div id="hearts"></div>

  <header id="top">
    <div class="brand"><span class="logo">💒</span><div><b>Đám Cưới Làng Quê</b><small>Tặng quà làm cô dâu, chú rể</small></div></div>
    <div class="pills">
      <span class="pill" id="online">0 khách đang xem</span>
      <span class="pill" id="liveStatus">Chưa kết nối</span>
      <button class="pill btn" id="musicBtn" title="Nhạc nền">🎵</button>
      <button class="pill btn" id="soundBtn" title="Âm thanh">🔈</button>
    </div>
  </header>

  <div id="weddingBox"></div>
  <div id="giftList"></div>
  <div id="battleBox"></div>
  <div id="battleGifts"></div>
  <div id="ultimate" hidden></div>
  <div id="banner" hidden></div>
  <div id="mcCaption" hidden></div>
  <ul id="feedFloat"></ul>

  <div id="sim" hidden>
    <button id="simToggle" class="simToggle">🧪 Mô phỏng LIVE</button>
    <div id="simBody" class="panel"></div>
  </div>
  <div id="fairNote">Trò chơi giải trí · Quà tặng là tự nguyện, không đổi ra tiền hay phần thưởng · Khách dự cưới là người xem thật trong live</div>
  <div id="offline" hidden>Mất kết nối server, đang thử lại…</div>
</div>
<script src="app.js"></script>
</body>
</html>
